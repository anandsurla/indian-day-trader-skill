name: Live Indian NSE & BSE Autonomous Paper Trader (Every 15m Market Hours)

on:
  schedule:
    # Runs every 15 minutes during Indian Market Hours (09:15 IST to 15:30 IST, Mon-Fri)
    # 03:45 UTC to 10:00 UTC = 09:15 IST to 15:30 IST
    - cron: '*/15 4-9 * * 1-5'
    - cron: '45 3 * * 1-5'
    - cron: '0,15,30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-indian-trader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Monitor Active Trade (Entry / Trail / Exit) & Scan NSE/BSE
        env:
          LIVE_YAHOO: 'true'
        run: |
          node -e '
            const trader = require("./trader/indian_trader");
            const reporter = require("./trader/reporter");
            (async () => {
              const mon = await trader.monitorAndManageActiveTrade();
              console.log("Monitor status:", mon.status);
              if (mon.status === "NO_OPEN_POSITION" || mon.status === "CLOSED_AUTONOMOUSLY") {
                await trader.runAutonomousPipeline();
              }
              reporter.generateAllReports();
            })();
          '

      - name: Commit & Push Live Trade State + Day/Weekly Reports + GitHub Pages Dashboard
        run: |
          git config user.name "Anand Surla (Autonomous Bot)"
          git config user.email "anand.bvc@gmail.com"
          git add reports/ trader/ docs/
          git diff --staged --quiet || git commit -m "Live Trade Monitor: Update NSE/BSE position, Day-Wise & Weekly reports ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push origin main
